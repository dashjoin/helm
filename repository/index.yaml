apiVersion: v1
entries:
  dashjoin:
  - annotations:
      dashjoin.com/secrets: |
        - key: DJ_ADMIN_PASS
          description: Dashjoin admin password (also AIA Jupyter token)
          required: true
          generate: {length: 24}
        - key: GITHUB_USER
          description: Git user for the app URL (not set = cluster read-only token)
        - key: GITHUB_TOKEN
          description: Git token for the app URL (not set = cluster read-only token)
        - key: POSTGRES_PASSWORD
          description: Postgres superuser password
          when: postgres.enabled
          required: true
          generate: {length: 32}
        - key: OPENAI_API_KEY
          description: OpenAI API key
          when: aia.enabled
        - key: MISTRAL_API_KEY
          description: Mistral API key
          when: aia.enabled
        - key: DJAI_UI_AUTH_PASS
          description: AIA admin UI password
          when: aia.enabled
          generate: {length: 24}
        - key: DJAI_ADMIN_PASS
          description: AIA API admin password
          when: aia.enabled
          generate: {length: 24}
        - key: MCP_AUTH_TOKEN
          description: Bearer token of the MCP proxy
          when: mcpserver.enabled
          generate: {length: 40}
        - key: MCP_BUILTIN_AUTH
          description: Authorization header AIA sends to the MCP proxy
          when: aia.enabled
          generate: {from: MCP_AUTH_TOKEN, prefix: "Bearer "}
